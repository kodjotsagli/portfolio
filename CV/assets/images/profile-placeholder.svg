<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="avatarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle tech/grid lines -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="6,6" />
  <circle cx="200" cy="200" r="100" fill="none" stroke="rgba(212,175,55,0.2)" stroke-width="1.5" />
  
  <!-- Professional Silhouette / Monogram Core -->
  <circle cx="200" cy="155" r="55" fill="rgba(255,255,255,0.92)" />
  <path d="M 100 330 C 100 245, 140 230, 200 230 C 260 230, 300 245, 300 330 Z" fill="rgba(255,255,255,0.92)" />
  
  <!-- Badge Accent -->
  <circle cx="275" cy="275" r="32" fill="url(#avatarGold)" filter="url(#glow)" />
  <path d="M 265 275 L 272 282 L 287 267" fill="none" stroke="#0A192F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
