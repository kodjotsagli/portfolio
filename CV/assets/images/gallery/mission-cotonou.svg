<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="cotonouBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="60%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="goldCotonou" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#cotonouBg)"/>
  
  <!-- Map / Compass / Assessment motif -->
  <circle cx="480" cy="140" r="100" fill="none" stroke="rgba(251, 191, 36, 0.2)" stroke-width="2"/>
  <path d="M 480 50 L 480 230 M 390 140 L 570 140" stroke="rgba(251, 191, 36, 0.15)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="480,70 490,130 480,140 470,130" fill="url(#goldCotonou)"/>
  <polygon points="480,210 490,150 480,140 470,150" fill="rgba(255,255,255,0.4)"/>

  <!-- Analytics / Data charts bars -->
  <g transform="translate(60, 160)">
    <rect x="0" y="50" width="24" height="50" rx="4" fill="rgba(255,255,255,0.2)"/>
    <rect x="36" y="30" width="24" height="70" rx="4" fill="rgba(255,255,255,0.35)"/>
    <rect x="72" y="10" width="24" height="90" rx="4" fill="url(#goldCotonou)"/>
    <rect x="108" y="25" width="24" height="75" rx="4" fill="rgba(255,255,255,0.5)"/>
    <line x1="-10" y1="105" x2="150" y2="105" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  </g>

  <!-- Badge -->
  <rect x="40" y="40" width="250" height="34" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="58" cy="57" r="6" fill="#FBBF24"/>
  <text x="74" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">Mission d'Évaluation — Bénin</text>
  
  <text x="40" y="320" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Port de Pêche Artisanale de Cotonou</text>
  <text x="40" y="338" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.8)">Collecte de données, diagnostic &amp; concertation institutionnelle</text>
</svg>
