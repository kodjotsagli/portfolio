<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="oaficBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="60%" stop-color="#1E3E62"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#oaficBg)"/>
  
  <!-- Subtle Grid & Geometry -->
  <g opacity="0.15">
    <line x1="50" y1="0" x2="50" y2="350" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="350" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="250" y1="0" x2="250" y2="350" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="350" y1="0" x2="350" y2="350" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="350" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="550" y1="0" x2="550" y2="350" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="100" x2="600" y2="100" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Port Crane & Vessel Silhouette -->
  <path d="M 80 250 L 120 120 L 260 120 L 290 250 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="120" y1="120" x2="380" y2="90" stroke="url(#goldAcc)" stroke-width="3"/>
  <line x1="280" y1="100" x2="280" y2="180" stroke="url(#goldAcc)" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="260" y="180" width="40" height="24" rx="4" fill="url(#goldAcc)" opacity="0.85"/>

  <!-- Stylized Harbor Waves -->
  <path d="M 0 280 C 150 250, 250 310, 400 270 C 500 240, 550 280, 600 260 L 600 350 L 0 350 Z" fill="url(#waveGrad)" opacity="0.75"/>
  <path d="M 0 300 C 120 280, 300 320, 450 290 C 530 270, 570 310, 600 300 L 600 350 L 0 350 Z" fill="#0A192F" opacity="0.6"/>

  <!-- Badge & Title -->
  <rect x="40" y="40" width="220" height="34" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="58" cy="57" r="6" fill="#10B981"/>
  <text x="74" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">OAFIC Co., Ltd — Togo</text>
  
  <text x="40" y="320" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Port de Pêche de Lomé</text>
  <text x="40" y="338" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.8)">Coopération Internationale &amp; Coordination Portuaire</text>
</svg>
