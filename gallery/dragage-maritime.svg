<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="emiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="tealWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#emiBg)"/>
  
  <!-- Nautical Grid / Sonar Depth Rings -->
  <circle cx="450" cy="180" r="160" fill="none" stroke="rgba(20, 184, 166, 0.15)" stroke-width="1.5"/>
  <circle cx="450" cy="180" r="100" fill="none" stroke="rgba(20, 184, 166, 0.25)" stroke-width="1.5" stroke-dasharray="8,6"/>
  <circle cx="450" cy="180" r="40" fill="none" stroke="rgba(20, 184, 166, 0.4)" stroke-width="1.5"/>
  
  <!-- Dredging vessel icon outline -->
  <path d="M 80 230 L 320 230 L 290 270 L 110 270 Z" fill="rgba(255,255,255,0.15)" stroke="#14B8A6" stroke-width="2"/>
  <rect x="130" y="190" width="70" height="40" rx="3" fill="rgba(255,255,255,0.2)"/>
  <line x1="260" y1="230" x2="350" y2="300" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="350" cy="300" r="12" fill="#F59E0B" opacity="0.8"/>

  <!-- Water layer -->
  <path d="M 0 260 C 150 240, 300 280, 450 250 C 520 235, 570 255, 600 245 L 600 350 L 0 350 Z" fill="url(#tealWave)" opacity="0.65"/>
  
  <!-- Badge -->
  <rect x="40" y="40" width="220" height="34" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="58" cy="57" r="6" fill="#F59E0B"/>
  <text x="74" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">EMI Sarl — Lomé, Togo</text>
  
  <text x="40" y="320" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Coordination Projet de Dragage</text>
  <text x="40" y="338" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.8)">Infrastructures Maritimes &amp; Opérations de Terrain</text>
</svg>
